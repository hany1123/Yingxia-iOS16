name: Yingxia16
options:
  bundleIdPrefix: com.yingxia
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: "minimal"
    GENERATE_INFOPLIST_FILE: "NO"
    ENABLE_BITCODE: "NO"
targets:
  Yingxia16:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Yingxia16/App.swift
      - path: Yingxia16/Models.swift
      - path: Yingxia16/API.swift
      - path: Yingxia16/Store.swift
      - path: Yingxia16/Views.swift
      - path: Yingxia16/Player.swift
    resources:
      - Yingxia16/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Yingxia16/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.yingxia.ios16
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        DEVELOPMENT_TEAM: ""
